name: Android compile and tests

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Pure Kotlin tests
        run: ./gradlew :intelligence:test --no-daemon
      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trippin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Render design snapshots
        run: ./gradlew :app:testDebugUnitTest --tests '*DesignSnapshotTest' --no-daemon
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-snapshots
          path: app/build/snapshots/*.png
