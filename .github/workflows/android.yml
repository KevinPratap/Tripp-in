name: Android build and tests

on:
  push:
    branches: ['claude/**', main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build everything, keep the log
        run: |
          mkdir -p /tmp/out
          set +e
          ./gradlew :intelligence:test :app:compileDebugKotlin :app:assembleRelease --no-daemon --continue > /tmp/out/gradle.log 2>&1
          echo "exit $?" >> /tmp/out/gradle.log
          true
      - name: Publish log
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git fetch origin ci-output:refs/remotes/origin/ci-output
          git worktree add --detach /tmp/wt origin/ci-output
          cd /tmp/wt && rm -rf out && mkdir out
          grep -nE "^e: |FAILED|error:|What went wrong|Execution failed|BUILD|Caused by|Could not|> " /tmp/out/gradle.log | head -150 > out/summary.txt
          tail -60 /tmp/out/gradle.log > out/tail.txt
          git add out && git commit -m "ci log for $GITHUB_SHA" || true
          git push origin HEAD:ci-output
