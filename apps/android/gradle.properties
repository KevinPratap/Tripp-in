org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP2 is off: Room 2.6.1's annotation processor hits a known KSP2 incompatibility
# ("IllegalStateException: unexpected jvm signature V") when resolving a DAO's suspend
# query return type. Legacy KSP (the default before this flag existed) processes Room
# correctly; flip this back to true once Room ships full KSP2 support.
ksp.useKSP2=false
