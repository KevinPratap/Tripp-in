version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: trippin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-trippin_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trippin_secret_pass}
      POSTGRES_DB: ${DB_NAME:-trippin_ai_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trippin_user} -d ${DB_NAME:-trippin_ai_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trippin_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
